<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkit — Your link list</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">
        <span class="brand-mark">🔗</span> Linkit
      </h1>
      <span class="count" id="count">0 links</span>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input
        type="search"
        id="search"
        class="search"
        placeholder="Search links..."
        aria-label="Search links"
      />
    </section>

    <section class="form-card" id="form-card">
      <form id="link-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. MDN Web Docs" required />
        </div>
        <div class="field">
          <label for="url">Link</label>
          <input type="url" id="url" placeholder="https://example.com" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" rows="2" placeholder="What is this link about?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Add link</button>
      </form>
    </section>

    <section class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">🗂️</div>
      <h2>Nothing here yet</h2>
      <p>Add your first link above and it will show up here.</p>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <!-- Edit modal -->
  <div class="overlay" id="edit-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h2 id="edit-title">Edit link</h2>
      <form id="edit-form" novalidate>
        <div class="field">
          <label for="edit-name">Title</label>
          <input type="text" id="edit-name" required />
        </div>
        <div class="field">
          <label for="edit-url">Link</label>
          <input type="url" id="edit-url" required />
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="edit-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="overlay" id="delete-overlay" hidden>
    <div class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="delete-title">
      <h2 id="delete-title">Delete link?</h2>
      <p class="delete-text">This will remove <strong id="delete-name"></strong> permanently.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="delete-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
